trigger:
- function-app

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'   # Replace with your service connection
  resourceGroupName: 'test-function-rg'
  location: 'Central India'
  functionAppName: 'my-node-funcapp-0213'

steps:
# Step 1 - Create RG if not exists
- task: AzureCLI@2
  displayName: 'Create Resource Group (if not exists)'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Checking if resource group $(resourceGroupName) exists..."
      if ! az group show --name $(resourceGroupName) &>/dev/null; then
        echo "Creating resource group: $(resourceGroupName)"
        az group create --name $(resourceGroupName) --location "$(location)"
      else
        echo "Resource group $(resourceGroupName) already exists."
      fi

# Step 2 - Deploy Function App Infra
- task: AzureCLI@2
  displayName: 'Deploy Function App Infrastructure using Bicep'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Deploying Function App infra..."
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file infra/main.bicep \
        --parameters location="$(location)"

# Step 3 - Deploy the Code
- task: AzureFunctionApp@2
  displayName: 'Deploy Function App Code'
  inputs:
    azureSubscription: $(azureSubscription)
    appType: functionApp
    appName: $(functionAppName)
    package: '$(System.DefaultWorkingDirectory)/functionapp.zip'
