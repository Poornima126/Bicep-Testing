trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'
  resourceGroupName: 'test'
  location: 'Central India'
  templateFile: 'infra/main.bicep'
  functionAppName: 'my-node-funcapp-0213'
  storageAccountName: 'mynodestorage12345'   # must match what's in Bicep

steps:
- task: AzureCLI@2
  displayName: 'Deploy Function App Infrastructure'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Deploying Function App infrastructure..."
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file $(templateFile) \
        --parameters location="$(location)" || exit 1

- task: AzureCLI@2
  displayName: 'Configure Storage Connection String for Function App'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Fetching storage account key..."
      key=$(az storage account keys list --account-name $(storageAccountName) --query "[0].value" -o tsv)
      conn="DefaultEndpointsProtocol=https;AccountName=$(storageAccountName);AccountKey=$key;EndpointSuffix=core.windows.net"
      echo "Updating AzureWebJobsStorage setting..."
      az functionapp config appsettings set \
        --name $(functionAppName) \
        --resource-group $(resourceGroupName) \
        --settings AzureWebJobsStorage="$conn"

- task: Bash@3
  displayName: 'Clone Function App Code'
  inputs:
    targetType: inline
    script: |
      git clone --branch function-app-code https://github.com/Poornima126/Bicep-Testing.git function-code
      cd function-code
      echo "Code cloned successfully"

- task: AzureFunctionApp@2
  displayName: 'Deploy Function App Code'
  inputs:
    azureSubscription: $(azureSubscription)
    appType: functionApp
    appName: $(functionAppName)
    package: '$(System.DefaultWorkingDirectory)/function-code'
