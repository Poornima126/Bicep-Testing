trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'  # Replace with your Azure DevOps service connection name
  location: 'Central India'
  rgName: 'test'
  appServicePlanName: 'my-demo-webapp-0213-plan'
  webAppName: 'my-demo-webapp-0213'
  skuName: 'B1'

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Deploying infrastructure using Bicep..."

      az deployment sub create \
        --location "$(location)" \
        --template-file infra/main.bicep \
        --parameters rgName=$(rgName) location="$(location)" \
                     appServicePlanName=$(appServicePlanName) \
                     webAppName=$(webAppName) \
                     skuName=$(skuName)

      echo "Deployment completed successfully!"
