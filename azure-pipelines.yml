trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'
  resourceGroupName: 'test'
  location: 'Central India'
  functionAppName: 'my-node-funcapp-0213'

stages:

# ========================
# Stage 1 - Deploy Infra (AppService + FunctionApp)
# ========================
- stage: Deploy_Infra
  displayName: 'Deploy all infrastructure (Bicep Modules)'
  jobs:
  - job: deployInfra
    displayName: 'Deploy AppService + FunctionApp'
    steps:
    - task: AzureCLI@2
      displayName: 'Ensure Resource Group Exists'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking if resource group exists..."
          if ! az group show --name $(resourceGroupName) &>/dev/null; then
            az group create --name $(resourceGroupName) --location "$(location)"
          fi

    - task: AzureCLI@2
      displayName: 'Deploy all Bicep modules'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying using root main.bicep..."
          az deployment group create \
            --resource-group $(resourceGroupName) \
            --template-file main.bicep \
            --parameters location="$(location)"
          echo "✅ All infra deployed successfully!"

# ========================
# Stage 2 - Deploy Function App Code
# ========================
- stage: Deploy_FunctionApp_Code
  displayName: 'Deploy Function App Code'
  dependsOn: Deploy_Infra
  jobs:
  - job: DeployFunctionCode
    displayName: 'Deploy function code to Azure'
    steps:
    - checkout: self

    - task: ArchiveFiles@2
      displayName: 'Archive function app code'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/functionapp_code'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(System.DefaultWorkingDirectory)/functionapp.zip'
        replaceExistingArchive: true

    - task: AzureFunctionApp@2
      displayName: 'Deploy to Function App'
      inputs:
        azureSubscription: $(azureSubscription)
        appType: functionApp
        appName: $(functionAppName)
        package: '$(System.DefaultWorkingDirectory)/functionapp.zip'
