trigger:
- bicep-infra
- function-app

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'
  resourceGroupName: 'viziapps-prod'  # ✅ existing RG
  location: 'Central India'
  templateFile: 'main.bicep'
  functionAppName: 'my-node-funcapp-0213'
  storageAccountName: 'mynodestorage12345'
  webAppPlanName: 'ASP-viziap-standard-prod'               # ✅ existing app service plan
  functionAppPlanName: 'ASP-viziap-standard-prod-functionapp'  # ✅ existing function app plan
  webAppName: 'my-demo-webapp-0213'

stages:
# ===========================
# Stage 1 - Deploy Infra
# ===========================
- stage: Deploy_Infrastructure
  displayName: "Deploy Infrastructure"
  jobs:
  - job: DeployInfra
    displayName: "Deploy App Service + Function App Infra"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Deploy App Service + Function App Infra using Bicep"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying App Service + Function App Infra..."
          az deployment group create \
            --resource-group $(resourceGroupName) \
            --template-file $(templateFile) \
            --parameters location="$(location)" \
            --parameters webAppPlanName="$(webAppPlanName)" \
            --parameters functionAppPlanName="$(functionAppPlanName)" \
            --parameters webAppName="$(webAppName)" \
            --parameters functionAppName="$(functionAppName)" \
            --parameters storageAccountName="$(storageAccountName)"

# ===========================
# Stage 2 - Deploy Function Code
# ===========================
- stage: Deploy_FunctionApp_Code
  displayName: "Deploy Function App Code"
  dependsOn: Deploy_Infrastructure
  jobs:
  - job: DeployFunctionCode
    displayName: "Deploy Function App"
    steps:
    - checkout: self
      clean: true

    - task: Bash@3
      displayName: "Clone Function App Code (function-app-code branch)"
      inputs:
        targetType: inline
        script: |
          echo "Cloning function-app-code branch..."
          git clone --branch function-app-code https://github.com/Poornima126/Bicep-Testing.git function-app-code
          echo "Code cloned successfully"
          ls -R function-app-code

    - task: ArchiveFiles@2
      displayName: "Archive Function App code"
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/function-app-code/functionapp/functionapp'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(System.DefaultWorkingDirectory)/functionapp.zip'
        replaceExistingArchive: true

    - task: AzureFunctionApp@2
      displayName: "Deploy Function App Code to Azure"
      inputs:
        azureSubscription: $(azureSubscription)
        appType: functionApp
        appName: $(functionAppName)
        package: '$(System.DefaultWorkingDirectory)/functionapp.zip'

    - task: AzureCLI@2
      displayName: "Add Environment Variables to Function App"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Adding environment variables to Function App..."
          az functionapp config appsettings set \
            --name $(functionAppName) \
            --resource-group $(resourceGroupName) \
            --settings ENVIRONMENT=production VERSION=1.0.0
