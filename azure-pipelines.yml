trigger:
- bicep-infra
- function-app-code

pool:
  vmImage: 'ubuntu-latest'

# ==============================================
# Global Static Variables
# ==============================================
variables:
- name: azureSubscription
  value: 'azure-service-connection'
- name: resourceGroupName
  value: 'viziapps-prod'
- name: location
  value: 'Central India'
- name: templateFile
  value: 'main.bicep'
- name: webAppPlanName
  value: 'ASP-viziap-standard-prod'
- name: functionAppPlanName
  value: 'ASP-viziap-standard-prod-functionapp'
- name: webAppName
  value: 'my-demo-webapp-0213'
- name: functionAppName
  value: 'my-node-funcapp-0213'
- name: storageAccountName
  value: 'mynodestorage12345'

# ==============================================
# Stage 1 - Deploy Infra using Bicep
# ==============================================
stages:
- stage: Deploy_Infrastructure
  displayName: "Deploy Infrastructure"
  jobs:
  - job: DeployInfra
    displayName: "Deploy App Service + Function App Infra"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Validate Resource Group"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking if resource group $(resourceGroupName) exists..."
          az group show --name $(resourceGroupName)

    - task: AzureCLI@2
      displayName: "Deploy Infra using Bicep"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying Web App + Function App using existing plans and storage account..."
          az deployment group create \
            --resource-group $(resourceGroupName) \
            --template-file $(templateFile) \
            --parameters \
              location="$(location)" \
              webAppPlanName="$(webAppPlanName)" \
              functionAppPlanName="$(functionAppPlanName)" \
              webAppName="$(webAppName)" \
              functionAppName="$(functionAppName)" \
              storageAccountName="$(storageAccountName)"

# ==============================================
# Stage 2 - Deploy Function App Code + Variables
# ==============================================
- stage: Deploy_FunctionApp_Code
  displayName: "Deploy Function App Code"
  dependsOn: Deploy_Infrastructure
  variables:
  - group: FunctionApp-Variables       # ✅ Load Function App variable group
  jobs:
  - job: DeployFunctionCode
    displayName: "Deploy Function App"
    steps:
    - checkout: self
      clean: true

    - task: Bash@3
      displayName: "Clone Function App Code (function-app-code branch)"
      inputs:
        targetType: inline
        script: |
          echo "Cloning function-app-code branch..."
          git clone --branch function-app-code https://github.com/Poornima126/Bicep-Testing.git function-app-code
          echo "Code cloned successfully"
          ls -R function-app-code

    - task: ArchiveFiles@2
      displayName: "Archive Function App code"
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/function-app-code/functionapp/functionapp'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(System.DefaultWorkingDirectory)/functionapp.zip'
        replaceExistingArchive: true

    - task: AzureFunctionApp@2
      displayName: "Deploy Function App Code to Azure"
      inputs:
        azureSubscription: $(azureSubscription)
        appType: functionApp
        appName: $(functionAppName)
        package: '$(System.DefaultWorkingDirectory)/functionapp.zip'

    - task: AzureCLI@2
      displayName: "Add Environment Variables to Function App"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Applying environment variables from variable group to Function App..."
          az functionapp config appsettings set \
            --name $(functionAppName) \
            --resource-group $(resourceGroupName) \
            --settings \
              "API_KEY=$(API_KEY)" \
              "STORAGE_CONNECTION_STRING=$(STORAGE_CONNECTION_STRING)" \
              "ConnectionStrings__DefaultConnection=$(ConnectionStrings__DefaultConnection)" \
              "APPINSIGHTS_INSTRUMENTATIONKEY=$(APPINSIGHTS_INSTRUMENTATIONKEY)"

# ==============================================
# Stage 3 - Deploy App Service Code + Variables
# ==============================================
- stage: Deploy_AppService_Code
  displayName: "Deploy App Service Code"
  dependsOn: Deploy_Infrastructure
  variables:
  - group: AppService-Variables        # ✅ Load App Service variable group
  jobs:
  - job: DeployWebApp
    displayName: "Deploy Web App"
    steps:
    - checkout: self
      clean: true

    - task: Bash@3
      displayName: "Clone Web App Code (main branch)"
      inputs:
        targetType: inline
        script: |
          echo "Cloning main branch for App Service..."
          git clone --branch main https://github.com/Poornima126/Bicep-Testing.git webapp-code
          echo "Code cloned successfully"
          ls -R webapp-code

    - task: ArchiveFiles@2
      displayName: "Archive Web App code"
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/webapp-code/webapp'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(System.DefaultWorkingDirectory)/webapp.zip'
        replaceExistingArchive: true

    - task: AzureWebApp@1
      displayName: "Deploy Web App Code to Azure"
      inputs:
        azureSubscription: $(azureSubscription)
        appType: webApp
        appName: $(webAppName)
        package: '$(System.DefaultWorkingDirectory)/webapp.zip'

    - task: AzureCLI@2
      displayName: "Add Environment Variables to App Service"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Applying environment variables from variable group to App Service..."
          az webapp config appsettings set \
            --name $(webAppName) \
            --resource-group $(resourceGroupName) \
            --settings \
              "API_KEY=$(API_KEY)" \
              "STORAGE_CONNECTION_STRING=$(STORAGE_CONNECTION_STRING)" \
              "ConnectionStrings__DefaultConnection=$(ConnectionStrings__DefaultConnection)" \
              "APPINSIGHTS_INSTRUMENTATIONKEY=$(APPINSIGHTS_INSTRUMENTATIONKEY)"
