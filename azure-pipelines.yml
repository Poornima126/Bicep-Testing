trigger:
- bicep-infra
- function-app-code

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'
  resourceGroup: 'test'
  location: 'CentralIndia'
  functionAppName: 'my-node-funcapp-0213'

stages:
# -------------------------------
# Stage 1: Infrastructure Deployment
# -------------------------------
- stage: DeployInfrastructure
  displayName: 'Deploy Infrastructure'
  jobs:
  - job: DeployInfra
    displayName: 'Bicep Infra Deployment'
    steps:
    - checkout: self

    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "🚀 Deploying Infrastructure..."
          az deployment group create \
            --resource-group $(resourceGroup) \
            --template-file main.bicep \
            --parameters location=$(location)
          echo "✅ Infra deployed successfully!"

# -------------------------------
# Stage 2: Function App Deployment
# -------------------------------
- stage: DeployFunctionApp
  displayName: 'Deploy Function App Code'
  dependsOn: DeployInfrastructure
  condition: succeeded()
  jobs:
  - job: DeployFunc
    displayName: 'Function App Deployment'
    steps:
    # Checkout the function-app-code branch
    - checkout: self
      clean: true
      persistCredentials: true

    - script: |
        echo "🔄 Switching to branch: function-app-code"
        git fetch origin function-app-code
        git checkout function-app-code
      displayName: 'Checkout Function App Branch'

    # Zip the Function App code
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
      displayName: 'Archive Function App Code'

    # Deploy to Azure Function App
    - task: AzureFunctionApp@1
      displayName: 'Deploy to Azure Function App'
      inputs:
        azureSubscription: $(azureSubscription)
        appType: 'functionApp'
        appName: $(functionAppName)
        package: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
