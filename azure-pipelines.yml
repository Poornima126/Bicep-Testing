trigger:
- bicep-infra

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'
  location: 'CentralIndia'
  resourceGroup: 'test'

stages:
- stage: Deploy_Infrastructure
  displayName: 'Deploy Infrastructure using Bicep'
  jobs:
  - job: DeployInfra
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "🚀 Deploying Infrastructure..."
          az group create --name $(resourceGroup) --location $(location)
          az deployment group create \
            --resource-group $(resourceGroup) \
            --template-file main.bicep \
            --parameters location=$(location)
          echo "✅ Infra deployed successfully!"

- stage: Deploy_FunctionApp_Code
  displayName: 'Deploy Function App Code'
  dependsOn: Deploy_Infrastructure
  jobs:
  - job: DeployCode
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
      fetchDepth: 1
      submodules: false

    - checkout: git://$(Build.Repository.Name)@function-app-code

    - task: AzureFunctionApp@2
      inputs:
        azureSubscription: $(azureSubscription)
        appType: functionAppLinux
        appName: 'my-node-funcapp-0213'
        package: '$(System.DefaultWorkingDirectory)/function-app-code'
