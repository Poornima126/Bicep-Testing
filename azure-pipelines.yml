trigger:
- function-app

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'   # Service connection name in Azure DevOps
  resourceGroupName: 'test'
  location: 'Central India'
  templateFile: 'infra/main.bicep'
  functionAppName: 'my-node-funcapp-0213'
  packagePath: '$(System.DefaultWorkingDirectory)/functionapp.zip'

steps:

# Step 1: Create Resource Group if it doesn't exist
- task: AzureCLI@2
  displayName: 'Create Resource Group (if not exists)'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Checking if resource group $(resourceGroupName) exists..."
      if ! az group show --name $(resourceGroupName) &>/dev/null; then
        echo "Creating resource group: $(resourceGroupName)"
        az group create --name $(resourceGroupName) --location "$(location)"
      else
        echo "Resource group $(resourceGroupName) already exists."
      fi

# Step 2: Deploy Function App using Bicep
- task: AzureCLI@2
  displayName: 'Deploy Function App (Bicep)'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Deploying Function App and dependencies..."
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file $(templateFile) \
        --parameters location="$(location)" \
        --only-show-errors

# Step 3: Deploy the Function App Code (ZIP)
- task: AzureFunctionApp@2
  displayName: 'Deploy Function App Code'
  inputs:
    azureSubscription: $(azureSubscription)
    appType: 'functionApp'
    appName: $(functionAppName)
    package: $(packagePath)

