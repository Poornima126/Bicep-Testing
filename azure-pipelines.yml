trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'   # Name of your Azure DevOps service connection
  resourceGroupName: 'test'                      # Resource Group name
  location: 'Central India'                      # Azure region
  templateFile: 'infra/main.bicep'

steps:
- task: AzureCLI@2
  displayName: 'Create Resource Group (if not exists)'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Checking if resource group $(resourceGroupName) exists..."
      if ! az group show --name $(resourceGroupName) &>/dev/null; then
        echo "Creating resource group: $(resourceGroupName)"
        az group create --name $(resourceGroupName) --location "$(location)"
      else
        echo "Resource group $(resourceGroupName) already exists."
      fi

- task: AzureCLI@2
  displayName: 'Deploy App Service and Plan using Bicep'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Deploying App Service and Plan to $(resourceGroupName)..."
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file $(templateFile) \
        --parameters location="$(location)"
