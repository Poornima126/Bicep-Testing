trigger:
- bicep-infra
- function-app-code

pool:
  vmImage: 'ubuntu-latest'

variables:
# Secure variable groups
- group: AppService-Variables
- group: FunctionApp-Variables

# Static pipeline variables
- name: azureSubscription
  value: 'azure-service-connection'
- name: resourceGroupName
  value: 'viziapps-prod'
- name: location
  value: 'Central India'
- name: templateFile
  value: 'main.bicep'
- name: webAppPlanName
  value: 'ASP-viziap-standard-prod'
- name: functionAppPlanName
  value: 'ASP-viziap-standard-prod-functionapp'
- name: webAppName
  value: 'my-demo-webapp-0213'
- name: functionAppName
  value: 'my-node-funcapp-0213'
- name: storageAccountName
  value: 'mynodestorage12345'

stages:
# ===========================
# Stage 1 - Deploy Infra
# ===========================
- stage: Deploy_Infrastructure
  displayName: "Deploy Infrastructure"
  jobs:
  - job: DeployInfra
    displayName: "Deploy App Service + Function App Infra"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Validate Resource Group"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Checking if resource group $(resourceGroupName) exists..."
          az group show --name $(resourceGroupName)

    - task: AzureCLI@2
      displayName: "Deploy Infra using Bicep"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying Web App + Function App using existing plans and storage account..."
          az deployment group create \
            --resource-group $(resourceGroupName) \
            --template-file $(templateFile) \
            --parameters \
              location="$(location)" \
              webAppPlanName="$(webAppPlanName)" \
              functionAppPlanName="$(functionAppPlanName)" \
              webAppName="$(webAppName)" \
              functionAppName="$(functionAppName)" \
              storageAccountName="$(storageAccountName)"

# ===========================
# Stage 2 - Update App Settings
# ===========================
- stage: Update_App_Settings
  displayName: "Update App Service and Function App Settings"
  dependsOn: Deploy_Infrastructure
  jobs:
  - job: UpdateSettings
    displayName: "Apply Environment Variables"
    steps:
    - checkout: none

    # Update App Service Environment Variables
    - task: AzureCLI@2
      displayName: "Update App Service Environment Variables"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Updating environment variables for App Service: $(webAppName)"
          az webapp config appsettings set \
            --name $(webAppName) \
            --resource-group $(resourceGroupName) \
            --settings \
              VAR1=$(AppService_VAR1) \
              VAR2=$(AppService_VAR2) \
              VAR3=$(AppService_VAR3)
          echo "App Service environment variables updated successfully."

    # Update Function App Environment Variables
    - task: AzureCLI@2
      displayName: "Update Function App Environment Variables"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Updating environment variables for Function App: $(functionAppName)"
          az functionapp config appsettings set \
            --name $(functionAppName) \
            --resource-group $(resourceGroupName) \
            --settings \
              VAR1=$(FunctionApp_VAR1) \
              VAR2=$(FunctionApp_VAR2) \
              VAR3=$(FunctionApp_VAR3)
          echo "Function App environment variables updated successfully."
