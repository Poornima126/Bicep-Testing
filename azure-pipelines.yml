trigger:
  branches:
    include:
      - bicep-infra
      - function-app-code

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'  # Azure DevOps service connection name
  resourceGroup: 'test'
  location: 'CentralIndia'
  appServicePlanName: 'my-demo-webapp-0213-plan'
  webAppName: 'my-demo-webapp-0213'
  functionAppName: 'my-node-funcapp-0213'
  storageAccountName: 'mystoragefunc0213'

stages:
  - stage: Deploy_Infrastructure
    displayName: "Deploy Bicep Infrastructure"
    jobs:
      - job: DeployInfra
        displayName: "Deploy Azure Infra"
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "🚀 Deploying Infrastructure..."
                az deployment group create \
                  --resource-group $(resourceGroup) \
                  --template-file main.bicep \
                  --parameters \
                    location=$(location) \
                    appServicePlanName=$(appServicePlanName) \
                    webAppName=$(webAppName) \
                    functionAppName=$(functionAppName) \
                    storageAccountName=$(storageAccountName)
                echo "✅ Infrastructure deployed successfully!"

  - stage: Deploy_Function_App
    displayName: "Deploy Function App Code"
    dependsOn: Deploy_Infrastructure
    jobs:
      - job: DeployCode
        displayName: "Deploy Function App"
        steps:
          # ✅ This checks out the specific branch you want
          - checkout: self
            clean: true
            persistCredentials: true
            fetchDepth: 0
            # This line ensures the right branch is used
            # NOTE: use a condition to pull from function-app-code branch
          - script: |
              echo "Switching to function-app-code branch..."
              git fetch origin function-app-code
              git checkout function-app-code
              git pull origin function-app-code
            displayName: "Checkout function-app-code branch"

          - task: AzureFunctionApp@2
            inputs:
              azureSubscription: $(azureSubscription)
              appType: 'functionAppLinux'
              appName: $(functionAppName)
              package: '$(System.DefaultWorkingDirectory)'
