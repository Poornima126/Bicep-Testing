trigger:
- function-app

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'     # Azure DevOps service connection name
  resourceGroupName: 'test'
  location: 'Central India'
  templateFile: 'infra/main.bicep'
  functionAppName: 'my-node-funcapp-0213'
  storageAccountName: 'mynodestorage12345'

steps:
# Step 1: Ensure Resource Group Exists
- task: AzureCLI@2
  displayName: 'Ensure Resource Group Exists'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Checking if resource group $(resourceGroupName) exists..."
      if ! az group show --name $(resourceGroupName) &>/dev/null; then
        echo "Creating resource group: $(resourceGroupName)"
        az group create --name $(resourceGroupName) --location "$(location)"
      else
        echo "Resource group $(resourceGroupName) already exists."
      fi

# Step 2: Deploy Function App Infrastructure using Bicep
- task: AzureCLI@2
  displayName: 'Deploy Function App Infrastructure (Bicep)'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Deploying Function App infrastructure..."
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file $(templateFile) \
        --parameters location="$(location)" \
        --parameters functionAppName=$(functionAppName) \
        --parameters storageAccountName=$(storageAccountName) || exit 1

# Step 3: Set AzureWebJobsStorage Connection
- task: AzureCLI@2
  displayName: 'Set AzureWebJobsStorage Connection'
  inputs:
    azureSubscription: $(azureSubscription)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Fetching storage account key..."
      key=$(az storage account keys list --account-name $(storageAccountName) --query "[0].value" -o tsv)
      conn="DefaultEndpointsProtocol=https;AccountName=$(storageAccountName);AccountKey=$key;EndpointSuffix=core.windows.net"
      echo "Updating AzureWebJobsStorage setting..."
      az functionapp config appsettings set \
        --name $(functionAppName) \
        --resource-group $(resourceGroupName) \
        --settings AzureWebJobsStorage="$conn"

# Step 4: Clone Function App Code Branch
- task: Bash@3
  displayName: 'Clone Function App Code (function-app-code branch)'
  inputs:
    targetType: inline
    script: |
      echo "Cloning function-app-code branch..."
      git clone --branch function-app-code https://github.com/Poornima126/Bicep-Testing.git function-app-code
      echo "Code cloned successfully"
      ls -R function-app-code

# Step 5: Install dependencies and create zip package
- task: Bash@3
  displayName: 'Install dependencies and zip Function App code'
  inputs:
    targetType: inline
    script: |
      echo "Zipping Function App code..."
      cd function-app-code/functionapp
      npm install --omit=dev
      zip -r ../../functionapp.zip .
      cd ../..
      echo "Zip package created successfully:"
      ls -lh functionapp.zip

# Step 6: Deploy Function App Code to Azure
- task: AzureFunctionApp@2
  displayName: 'Deploy Function App Code to Azure'
  inputs:
    azureSubscription: $(azureSubscription)
    appType: functionApp
    appName: $(functionAppName)
    package: '$(System.DefaultWorkingDirectory)/functionapp.zip'
