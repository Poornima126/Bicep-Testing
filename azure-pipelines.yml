trigger:
- main    # your infra branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'azure-service-connection'   # your service connection name
  resourceGroup: 'test'
  location: 'CentralIndia'
  functionAppName: 'my-demo-funcapp-0213'
  storageAccountName: 'mydemostorage0213'
  appServiceName: 'my-demo-webapp-0213'
  appServicePlanName: 'my-demo-webapp-0213-plan'

stages:
- stage: Infrastructure
  displayName: 'Deploy Infrastructure'
  jobs:
  - job: DeployInfra
    displayName: 'Deploy Infra using Bicep Modules'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy Infra (App Service + Function App)'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying infrastructure..."
          az deployment group create \
            --resource-group $(resourceGroup) \
            --template-file main.bicep \
            --parameters \
              location=$(location) \
              appServiceName=$(appServiceName) \
              appServicePlanName=$(appServicePlanName) \
              functionAppName=$(functionAppName) \
              storageAccountName=$(storageAccountName)

- stage: FunctionAppDeployment
  displayName: 'Deploy Function App Code'
  dependsOn: Infrastructure
  jobs:
  - job: DeployFunctionCode
    displayName: 'Zip and Deploy Function App Code'
    steps:
    - checkout: self
      persistCredentials: true

    - script: |
        git fetch origin function-app-code
        git checkout function-app-code
      displayName: 'Checkout Function App code branch'

    - task: ArchiveFiles@2
      displayName: 'Archive function app code'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
        replaceExistingArchive: true

    - task: AzureCLI@2
      displayName: 'Deploy function app code to Azure'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying code to Function App..."
          az functionapp deployment source config-zip \
            --resource-group $(resourceGroup) \
            --name $(functionAppName) \
            --src "$(Build.ArtifactStagingDirectory)/functionapp.zip"
